<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" aria-label="Active Projects - DoraCode, CodeFlow, Blogzilla">
  <title>Active Projects</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="url(#bgGrad)"/>

  <!-- ==================== PROCESS 01: DORACODE ==================== -->
  <g transform="translate(40, 20)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="720" height="175" rx="4" fill="#0B0D10" stroke="#C8FF5D" stroke-width="0.8" opacity="0.7"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="720" height="24" rx="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <rect x="0" y="20" width="720" height="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <!-- Window dots -->
    <circle cx="16" cy="12" r="3.5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="30" cy="12" r="3.5" fill="#C8FF5D" opacity="0.5"/>
    <circle cx="44" cy="12" r="3.5" fill="#8B929E" opacity="0.4"/>
    <!-- Process label -->
    <text x="68" y="16" font-family="'Courier New', monospace" font-size="10" fill="#C8FF5D" font-weight="bold" letter-spacing="1">[PROCESS 01]</text>
    <text x="190" y="16" font-family="'Courier New', monospace" font-size="10" fill="#E8E9E6" font-weight="bold" letter-spacing="2">DORACODE</text>

    <!-- Decorative icon: code diff marks -->
    <g transform="translate(660, 4)" opacity="0.4">
      <line x1="0" y1="4" x2="0" y2="16" stroke="#C8FF5D" stroke-width="1.5"/>
      <text x="4" y="9" font-family="'Courier New', monospace" font-size="7" fill="#C8FF5D">+</text>
      <text x="4" y="17" font-family="'Courier New', monospace" font-size="7" fill="#FF6B6B">-</text>
      <line x1="14" y1="4" x2="14" y2="16" stroke="#8B929E" stroke-width="0.5"/>
      <text x="18" y="9" font-family="'Courier New', monospace" font-size="7" fill="#C8FF5D">+</text>
      <text x="18" y="17" font-family="'Courier New', monospace" font-size="7" fill="#8B929E">~</text>
    </g>

    <!-- Content -->
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="50" fill="#C8FF5D">PURPOSE</tspan>
      <tspan fill="#8B929E">  : </tspan>
      <tspan fill="#E8E9E6">Collaborative code review</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="70" fill="#C8FF5D">CORE</tspan>
      <tspan fill="#8B929E">     : </tspan>
      <tspan fill="#E8E9E6">PR sessions / patch context / comments / GitHub API</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="90" fill="#C8FF5D">FEATURES</tspan>
      <tspan fill="#8B929E"> : </tspan>
      <tspan fill="#E8E9E6">Team roles (leader/member/viewer) · Discussion threads</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10">
      <tspan x="20" y="110" fill="#C8FF5D">STATUS</tspan>
      <tspan fill="#8B929E">   : </tspan>
      <tspan fill="#C8FF5D">Active development</tspan>
    </text>

    <!-- Separator -->
    <line x1="20" y1="125" x2="700" y2="125" stroke="#8B929E" stroke-width="0.3" opacity="0.3"/>

    <!-- Tagline -->
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan fill="#C8FF5D">› </tspan>
      <tspan fill="#E8E9E6" font-style="italic">"Give code reviews a shared space and meaningful context."</tspan>
    </text>

    <!-- Activity indicator -->
    <circle cx="700" cy="140" r="3" fill="#C8FF5D" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== PROCESS 02: CODEFLOW ==================== -->
  <g transform="translate(40, 215)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="720" height="190" rx="4" fill="#0B0D10" stroke="#C8FF5D" stroke-width="0.8" opacity="0.7"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="720" height="24" rx="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <rect x="0" y="20" width="720" height="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <!-- Window dots -->
    <circle cx="16" cy="12" r="3.5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="30" cy="12" r="3.5" fill="#C8FF5D" opacity="0.5"/>
    <circle cx="44" cy="12" r="3.5" fill="#8B929E" opacity="0.4"/>
    <!-- Process label -->
    <text x="68" y="16" font-family="'Courier New', monospace" font-size="10" fill="#C8FF5D" font-weight="bold" letter-spacing="1">[PROCESS 02]</text>
    <text x="190" y="16" font-family="'Courier New', monospace" font-size="10" fill="#E8E9E6" font-weight="bold" letter-spacing="2">CODEFLOW</text>

    <!-- Decorative icon: flowchart nodes -->
    <g transform="translate(650, 3)" opacity="0.4">
      <rect x="0" y="2" width="10" height="8" rx="1" fill="none" stroke="#C8FF5D" stroke-width="0.8"/>
      <line x1="5" y1="10" x2="5" y2="13" stroke="#C8FF5D" stroke-width="0.6"/>
      <rect x="0" y="13" width="10" height="8" rx="1" fill="none" stroke="#C8FF5D" stroke-width="0.8"/>
      <line x1="10" y1="6" x2="18" y2="6" stroke="#C8FF5D" stroke-width="0.6"/>
      <line x1="18" y1="6" x2="18" y2="17" stroke="#C8FF5D" stroke-width="0.6"/>
      <line x1="10" y1="17" x2="18" y2="17" stroke="#C8FF5D" stroke-width="0.6"/>
      <rect x="22" y="8" width="10" height="8" rx="4" fill="none" stroke="#8B929E" stroke-width="0.8"/>
      <line x1="18" y1="12" x2="22" y2="12" stroke="#8B929E" stroke-width="0.6"/>
    </g>

    <!-- Content -->
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="50" fill="#C8FF5D">PURPOSE</tspan>
      <tspan fill="#8B929E">  : </tspan>
      <tspan fill="#E8E9E6">Idea → visual technical plan</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="70" fill="#C8FF5D">CORE</tspan>
      <tspan fill="#8B929E">     : </tspan>
      <tspan fill="#E8E9E6">AI clarification / stack recommendations / flowcharts</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="90" fill="#C8FF5D">TECH</tspan>
      <tspan fill="#8B929E">     : </tspan>
      <tspan fill="#E8E9E6">React Flow / Mermaid.js / Dagre / Gemini API</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10">
      <tspan x="20" y="110" fill="#C8FF5D">STATUS</tspan>
      <tspan fill="#8B929E">   : </tspan>
      <tspan fill="#C8FF5D">Active development</tspan>
    </text>

    <!-- Separator -->
    <line x1="20" y1="125" x2="700" y2="125" stroke="#8B929E" stroke-width="0.3" opacity="0.3"/>

    <!-- Tagline -->
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan fill="#C8FF5D">› </tspan>
      <tspan fill="#E8E9E6" font-style="italic">"Turn a rough idea into a plan you can build."</tspan>
    </text>

    <!-- Activity indicator -->
    <circle cx="700" cy="140" r="3" fill="#C8FF5D" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== PROCESS 03: BLOGZILLA ==================== -->
  <g transform="translate(40, 425)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="720" height="175" rx="4" fill="#0B0D10" stroke="#C8FF5D" stroke-width="0.8" opacity="0.7"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="720" height="24" rx="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <rect x="0" y="20" width="720" height="4" fill="#C8FF5D" fill-opacity="0.06"/>
    <!-- Window dots -->
    <circle cx="16" cy="12" r="3.5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="30" cy="12" r="3.5" fill="#C8FF5D" opacity="0.5"/>
    <circle cx="44" cy="12" r="3.5" fill="#8B929E" opacity="0.4"/>
    <!-- Process label -->
    <text x="68" y="16" font-family="'Courier New', monospace" font-size="10" fill="#C8FF5D" font-weight="bold" letter-spacing="1">[PROCESS 03]</text>
    <text x="190" y="16" font-family="'Courier New', monospace" font-size="10" fill="#E8E9E6" font-weight="bold" letter-spacing="2">BLOGZILLA</text>

    <!-- Decorative icon: stacked layers -->
    <g transform="translate(660, 3)" opacity="0.4">
      <rect x="0" y="0" width="20" height="5" rx="1" fill="none" stroke="#8B929E" stroke-width="0.7"/>
      <rect x="0" y="7" width="20" height="5" rx="1" fill="none" stroke="#C8FF5D" stroke-width="0.7"/>
      <rect x="0" y="14" width="20" height="5" rx="1" fill="none" stroke="#8B929E" stroke-width="0.7"/>
    </g>

    <!-- Content -->
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="50" fill="#C8FF5D">PURPOSE</tspan>
      <tspan fill="#8B929E">  : </tspan>
      <tspan fill="#E8E9E6">Full-stack publishing</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="70" fill="#C8FF5D">FOCUS</tspan>
      <tspan fill="#8B929E">    : </tspan>
      <tspan fill="#E8E9E6">TypeScript / PostgreSQL modernization</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan x="20" y="90" fill="#C8FF5D">TECH</tspan>
      <tspan fill="#8B929E">     : </tspan>
      <tspan fill="#E8E9E6">React / Node.js / Express / Prisma</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="10">
      <tspan x="20" y="110" fill="#C8FF5D">STATUS</tspan>
      <tspan fill="#8B929E">   : </tspan>
      <tspan fill="#FF6B6B">Modernizing</tspan>
    </text>

    <!-- Separator -->
    <line x1="20" y1="125" x2="700" y2="125" stroke="#8B929E" stroke-width="0.3" opacity="0.3"/>

    <!-- Tagline -->
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="10" fill="#8B929E">
      <tspan fill="#C8FF5D">› </tspan>
      <tspan fill="#E8E9E6" font-style="italic">"A publishing platform evolving through deliberate engineering."</tspan>
    </text>

    <!-- Activity indicator (coral for modernizing) -->
    <circle cx="700" cy="140" r="3" fill="#FF6B6B" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Border -->
  <rect x="0" y="0" width="800" height="620" fill="none" stroke="#C8FF5D" stroke-width="0.5" opacity="0.1"/>
</svg>